<!doctype html><html><head><meta charset="utf-8" />
<style>
:root {
  --mfd-bg: #081018;
  --mfd-bg-2: #101c28;
  --mfd-text: #f4efe5;
  --mfd-text-dim: #aeb8c2;
  --mfd-gold: #d2ad35;
  --mfd-cyan: #42d9e8;
  --mfd-red: #e85f5f;
  --mfd-green: #60d394;
  --mfd-border: #2c4a5e;
  --mfd-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --mfd-font-pixel: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --mfd-sp-xs: 6px;
  --mfd-sp-sm: 10px;
  --mfd-sp-md: 16px;
  --mfd-sp-lg: 24px;
  --mfd-motion-fast: 180ms ease-out;
  --mfd-shadow-md: 0 12px 24px rgba(0, 0, 0, 0.35);
  --mfd-shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.45);
  --mfd-shadow-gold-strong: 0 0 24px rgba(210, 173, 53, 0.42);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 720px; background: #071019; color: var(--mfd-text); font-family: var(--mfd-font-mono); }
main { padding: 32px; display: grid; gap: 24px; }
h1 { margin: 0; font-size: 22px; letter-spacing: 0; color: var(--mfd-gold); }
.qa-grid { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 18px; max-width: 900px; }
.qa-cell { display: grid; gap: 10px; justify-items: center; padding: 16px 10px; border: 1px solid #20384a; background: #0b1722; }
.qa-label { color: var(--mfd-cyan); font-size: 12px; }
button { font-family: inherit; }
.mfd-chip {
  --chip-pose-transition: 180ms ease-out;
  --chip-pose-crossfade: 200ms ease-out;
  --chip-art-settle: 420ms cubic-bezier(0.2, 0.85, 0.22, 1);
  --chip-presence-ease: cubic-bezier(0.45, 0, 0.55, 1);
  --chip-art-width: 96px;
  --chip-art-height: 96px;
  --chip-object-position: center bottom;
  display: inline-grid;
  place-items: center;
  line-height: 0;
  isolation: isolate;
}

.mfd-chip__art-frame {
  position: relative;
  display: grid;
  place-items: center;
  width: var(--chip-art-width);
  height: var(--chip-art-height);
  overflow: hidden;
  border: 2px solid rgba(255, 215, 0, 0.42);
  border-radius: var(--mfd-rad-xl, 4px);
  background:
    linear-gradient(180deg, rgba(255, 215, 0, 0.12) 0%, rgba(0, 229, 255, 0.05) 38%, rgba(0, 0, 0, 0.08) 100%),
    linear-gradient(90deg, rgba(255, 255, 255, 0.04), transparent 32%, rgba(0, 229, 255, 0.05) 100%),
    var(--mfd-bg);
  box-shadow:
    0 18px 34px rgba(0, 0, 0, 0.34),
    0 6px 12px rgba(0, 229, 255, 0.08),
    0 0 0 1px rgba(0, 0, 0, 0.62) inset,
    0 0 0 1px rgba(255, 215, 0, 0.1);
  contain: layout paint;
  transform-origin: 50% 100%;
}

.mfd-chip[data-chip-size='sm'] .mfd-chip__art-frame {
  border-radius: 999px;
  border-color: rgba(255, 215, 0, 0.72);
}

.mfd-chip__stage-shadow {
  position: absolute;
  right: 13%;
  bottom: 4%;
  left: 13%;
  z-index: 0;
  height: 16%;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.28);
  filter: blur(4px);
  transform: scaleX(0.88);
  transform-origin: 50% 50%;
}

.mfd-chip__motion-rig {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  transform-origin: 50% 88%;
}

.mfd-chip__art-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: var(--chip-object-position);
  filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.36));
  transform-origin: 50% 88%;
  user-select: none;
}

.mfd-chip__shine {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.55;
  background:
    linear-gradient(110deg, transparent 0%, rgba(255, 255, 255, 0.1) 18%, transparent 34%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 42%);
  mix-blend-mode: screen;
}

.mfd-chip[data-chip-motion='animated'] .mfd-chip__art-frame {
  animation: mfd-chip-stage-presence 5.6s var(--chip-presence-ease) infinite;
}

.mfd-chip[data-chip-motion='animated'] .mfd-chip__stage-shadow {
  animation: mfd-chip-stage-shadow 5.6s var(--chip-presence-ease) infinite;
}

.mfd-chip[data-chip-motion='animated'] .mfd-chip__art-img {
  animation: mfd-chip-art-arrive var(--chip-art-settle) both;
}

.mfd-chip[data-chip-motion='animated'] .mfd-chip__shine {
  animation: mfd-chip-portrait-shine 7.5s ease-in-out infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-motion-profile='settled'] .mfd-chip__motion-rig {
  animation: mfd-chip-motion-settled 4.8s var(--chip-presence-ease) infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-motion-profile='focused'] .mfd-chip__motion-rig {
  animation: mfd-chip-motion-focused 4.2s ease-in-out infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-motion-profile='conversational'] .mfd-chip__motion-rig {
  animation: mfd-chip-motion-conversational 3.4s ease-in-out infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-motion-profile='gesture'] .mfd-chip__motion-rig {
  animation: mfd-chip-motion-gesture 3s ease-in-out infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-motion-profile='victory'] .mfd-chip__motion-rig {
  animation: mfd-chip-motion-victory 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-motion-profile='urgent'] .mfd-chip__motion-rig {
  animation: mfd-chip-motion-urgent 2.6s ease-in-out infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-motion-profile='downbeat'] .mfd-chip__motion-rig {
  animation: mfd-chip-motion-downbeat 5.8s ease-in-out infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-motion-profile='prop'] .mfd-chip__motion-rig {
  animation: mfd-chip-motion-prop 4.8s ease-in-out infinite;
}

.mfd-chip__scanline {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.14;
  background: repeating-linear-gradient(
    0deg,
    rgba(255, 255, 255, 0.16) 0,
    rgba(255, 255, 255, 0.16) 1px,
    transparent 1px,
    transparent 5px
  );
  mix-blend-mode: soft-light;
}

.mfd-chip-svg--legacy-contract {
  display: none !important;
}

.mfd-chip-svg {
  display: block;
  overflow: visible;
  animation: mfd-chip-pose-enter var(--chip-pose-transition);
}

.mfd-chip[data-chip-size='sm'] .mfd-chip-svg {
  --chip-outline: 3;
}

.mfd-chip[data-chip-size='md'],
.mfd-chip[data-chip-size='lg'] {
  --chip-outline: 4;
}

.mfd-chip-svg__floor-shadow {
  fill: var(--mfd-bg);
  opacity: 0.7;
}

.mfd-chip-svg__figure {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: mfd-chip-idle-breathe 2s steps(12, end) infinite;
}

.mfd-chip-svg__headset,
.mfd-chip-svg__head,
.mfd-chip-svg__arm,
.mfd-chip-svg__arm-overlay,
.mfd-chip-svg__hand-overlay,
.mfd-chip-svg__surprise-hand,
.mfd-chip-svg__hand-over-mouth,
.mfd-chip-svg__fist,
.mfd-chip-svg__thumb-group,
.mfd-chip-svg__warning-watch,
.mfd-chip-svg__brow,
.mfd-chip-svg__mouth,
.mfd-chip-svg__tablet,
.mfd-chip-svg__pose-fragment,
.mfd-chip-svg__headset-pad,
.mfd-chip-svg__mic-tip,
.mfd-chip-svg__mic-tip-flash {
  transform-box: fill-box;
  transform-origin: center;
  transition:
    transform var(--chip-pose-transition),
    opacity var(--chip-pose-transition);
}

.mfd-chip-svg__pants,
.mfd-chip-svg__shoe,
.mfd-chip-svg__jacket,
.mfd-chip-svg__jacket-panel,
.mfd-chip-svg__shirt,
.mfd-chip-svg__collar,
.mfd-chip-svg__sleeve,
.mfd-chip-svg__hand,
.mfd-chip-svg__neck,
.mfd-chip-svg__ear,
.mfd-chip-svg__face,
.mfd-chip-svg__hair,
.mfd-chip-svg__hair-lock,
.mfd-chip-svg__headset-pad,
.mfd-chip-svg__tablet-frame,
.mfd-chip-svg__tablet-screen,
.mfd-chip-svg__trophy,
.mfd-chip-svg__confetti,
.mfd-chip-svg__warning-card,
.mfd-chip-svg__arm-overlay,
.mfd-chip-svg__hand-overlay,
.mfd-chip-svg__surprise-hand,
.mfd-chip-svg__hand-over-mouth,
.mfd-chip-svg__fist,
.mfd-chip-svg__mic-tap,
.mfd-chip-svg__mic-tip-flash {
  stroke: var(--mfd-bg);
  stroke-width: var(--chip-outline, 4);
  stroke-linejoin: round;
}

.mfd-chip-svg__headset-band,
.mfd-chip-svg__mic-boom,
.mfd-chip-svg__zipper,
.mfd-chip-svg__tablet-pixel,
.mfd-chip-svg__brow,
.mfd-chip-svg__nose,
.mfd-chip-svg__mouth,
.mfd-chip-svg__signal,
.mfd-chip-svg__sound-wave,
.mfd-chip-svg__wave-line,
.mfd-chip-svg__trophy-handle,
.mfd-chip-svg__warning-mark,
.mfd-chip-svg__finger-line,
.mfd-chip-svg__shock-line,
.mfd-chip-svg__sad-shoulder,
.mfd-chip-svg__disappointed-eye,
.mfd-chip-svg__flat-mouth,
.mfd-chip-svg__whisper-brow,
.mfd-chip-svg__excitement-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mfd-chip-svg__pants,
.mfd-chip-svg__shirt {
  fill: var(--mfd-bg);
  stroke: var(--mfd-gold);
}

.mfd-chip-svg__shoe {
  fill: var(--mfd-bg);
  stroke: var(--mfd-cyan);
}

.mfd-chip-svg__jacket {
  fill: var(--mfd-red);
}

.mfd-chip-svg__jacket-panel--left,
.mfd-chip-svg__collar--right {
  fill: var(--mfd-gold);
}

.mfd-chip-svg__jacket-panel--right,
.mfd-chip-svg__collar--left {
  fill: var(--mfd-cyan);
}

.mfd-chip-svg__zipper {
  stroke: var(--mfd-bg);
  stroke-width: 3;
}

.mfd-chip-svg__sleeve {
  fill: var(--mfd-red);
}

.mfd-chip-svg__arm-overlay {
  fill: var(--mfd-red);
}

.mfd-chip-svg__hand,
.mfd-chip-svg__neck,
.mfd-chip-svg__ear,
.mfd-chip-svg__face,
.mfd-chip-svg__hand-overlay,
.mfd-chip-svg__surprise-hand,
.mfd-chip-svg__hand-over-mouth,
.mfd-chip-svg__fist {
  fill: var(--mfd-text);
}

.mfd-chip-svg__ear,
.mfd-chip-svg__neck {
  opacity: 0.82;
}

.mfd-chip-svg__hair,
.mfd-chip-svg__hair-lock {
  fill: var(--mfd-gold);
}

.mfd-chip-svg__headset-band,
.mfd-chip-svg__mic-boom {
  stroke: var(--mfd-cyan);
  stroke-width: 5;
}

.mfd-chip-svg__headset-pad,
.mfd-chip-svg__mic-tip,
.mfd-chip-svg__mic-tip-flash {
  fill: var(--mfd-cyan);
}

.mfd-chip-svg__eye {
  fill: var(--mfd-bg);
  animation: mfd-chip-eye-blink 4s steps(12, end) infinite;
}

.mfd-chip-svg__brow,
.mfd-chip-svg__nose,
.mfd-chip-svg__mouth {
  stroke: var(--mfd-bg);
  stroke-width: 4;
}

.mfd-chip-svg__mouth--talk,
.mfd-chip-svg__mouth--smile,
.mfd-chip-svg__mouth--concern {
  display: none;
}

.mfd-chip-svg__mouth--talk {
  fill: var(--mfd-red);
  stroke: var(--mfd-bg);
  animation: mfd-chip-mouth-talk 560ms steps(4, end) infinite;
}

.mfd-chip-svg__tablet-frame,
.mfd-chip-svg__warning-card {
  fill: var(--mfd-bg);
}

.mfd-chip-svg__tablet-screen {
  fill: var(--mfd-cyan);
  opacity: 0.78;
}

.mfd-chip-svg__tablet-pixel,
.mfd-chip-svg__signal,
.mfd-chip-svg__sound-wave,
.mfd-chip-svg__wave-line,
.mfd-chip-svg__trophy-handle,
.mfd-chip-svg__warning-mark {
  stroke: var(--mfd-gold);
  stroke-width: 4;
}

.mfd-chip-svg__ui-arrow,
.mfd-chip-svg__thought-dot,
.mfd-chip-svg__trophy {
  fill: var(--mfd-gold);
  stroke: var(--mfd-bg);
  stroke-width: 4;
  stroke-linejoin: round;
}

.mfd-chip-svg__confetti {
  fill: var(--mfd-cyan);
}

.mfd-chip-svg__prop-pixel,
.mfd-chip-svg__confetti-bit,
.mfd-chip-svg__mic-sparkle,
.mfd-chip-svg__telestrator-x-segment {
  stroke: none;
}

.mfd-chip-svg__tablet-pixel,
.mfd-chip-svg__confetti-bit--gold,
.mfd-chip-svg__mic-sparkle--gold {
  fill: var(--mfd-gold);
}

.mfd-chip-svg__confetti-bit--cyan,
.mfd-chip-svg__mic-sparkle--cyan,
.mfd-chip-svg__telestrator-x-segment {
  fill: var(--mfd-cyan);
}

.mfd-chip-svg__confetti-bit--green {
  fill: var(--mfd-green);
}

.mfd-chip[data-chip-motion='animated'][data-chip-pose='celebrate'] .mfd-chip-svg__confetti-bit {
  animation: mfd-chip-confetti-fall 8s steps(12, end) infinite;
}

.mfd-chip[data-chip-motion='animated'][data-chip-pose='mic-check'] .mfd-chip-svg__mic-sparkle {
  animation: mfd-chip-pixel-sparkle-twinkle 800ms steps(2, end) infinite;
}

.mfd-chip[data-chip-motion='animated'] .mfd-chip-svg__telestrator-x--drawing .mfd-chip-svg__telestrator-x-segment {
  animation: mfd-chip-telestrator-x-draw 1.2s steps(5, end) infinite;
}

.mfd-chip-svg__warning-mark {
  stroke: var(--mfd-red);
}

.mfd-chip-svg__finger-line,
.mfd-chip-svg__shock-line,
.mfd-chip-svg__sad-shoulder,
.mfd-chip-svg__disappointed-eye,
.mfd-chip-svg__flat-mouth,
.mfd-chip-svg__whisper-brow,
.mfd-chip-svg__excitement-line {
  stroke: var(--mfd-bg);
  stroke-width: 3;
}

.mfd-chip-svg__mic-tip--sad {
  fill: var(--mfd-red);
  opacity: 0.9;
}

.mfd-chip-svg__thumb-pixel--thumbs-up,
.mfd-chip-svg__watch-pixel--warning {
  fill: var(--mfd-gold);
  stroke: var(--mfd-bg);
  stroke-width: 2;
}

.mfd-chip-svg__mic-tap {
  fill: var(--mfd-cyan);
  opacity: 0;
  animation: mfd-chip-mic-check-tap 920ms steps(2, end) infinite;
}

.mfd-chip-svg__mic-tap--right {
  animation-delay: 220ms;
}

.mfd-chip-svg__mic-tip-flash {
  opacity: 0;
  animation: mfd-chip-mic-tip-flash 920ms steps(2, end) infinite;
}

.mfd-chip-svg__scanline-stripe {
  fill: var(--mfd-text);
}

.mfd-chip-svg__scanline-overlay {
  opacity: 0.1;
  pointer-events: none;
}

.mfd-chip-svg__pose-layer {
  pointer-events: none;
}

.mfd-chip[data-chip-motion='animated'] .mfd-chip-svg__pose-fade-in {
  animation: mfd-chip-pose-crossfade var(--chip-pose-crossfade);
}

.mfd-chip[data-chip-pose='talk'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='greeting'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='point-left'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='point-right'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='wave'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='celebrate'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='concern'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='warning'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='surprised'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='sad'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='disappointed'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='whispering'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='excited'] .mfd-chip-svg__mouth--line,
.mfd-chip[data-chip-pose='thumbs-up'] .mfd-chip-svg__mouth--line {
  display: none;
}

.mfd-chip[data-chip-pose='talk'] .mfd-chip-svg__mouth--talk,
.mfd-chip[data-chip-pose='point-left'] .mfd-chip-svg__mouth--talk,
.mfd-chip[data-chip-pose='point-right'] .mfd-chip-svg__mouth--talk {
  display: block;
}

.mfd-chip[data-chip-pose='surprised'] .mfd-chip-svg__mouth--talk {
  display: block;
}

.mfd-chip[data-chip-pose='greeting'] .mfd-chip-svg__mouth--smile,
.mfd-chip[data-chip-pose='wave'] .mfd-chip-svg__mouth--smile,
.mfd-chip[data-chip-pose='celebrate'] .mfd-chip-svg__mouth--smile,
.mfd-chip[data-chip-pose='excited'] .mfd-chip-svg__mouth--smile,
.mfd-chip[data-chip-pose='thumbs-up'] .mfd-chip-svg__mouth--smile {
  display: block;
}

.mfd-chip[data-chip-pose='concern'] .mfd-chip-svg__mouth--concern,
.mfd-chip[data-chip-pose='warning'] .mfd-chip-svg__mouth--concern,
.mfd-chip[data-chip-pose='sad'] .mfd-chip-svg__mouth--concern {
  display: block;
}

.mfd-chip[data-chip-pose='greeting'] .mfd-chip-svg__figure {
  transform: translate(1px, -2px) skewX(-2deg);
}

.mfd-chip[data-chip-motion='animated'][data-chip-pose='greeting'] .mfd-chip-svg__arm-overlay--greeting {
  animation: mfd-chip-greeting-point 2s steps(6, end) infinite;
}

.mfd-chip[data-chip-pose='point-left'] .mfd-chip-svg__arm--left {
  transform: rotate(-28deg) translate(-12px, -18px);
}

.mfd-chip[data-chip-pose='point-right'] .mfd-chip-svg__arm--right {
  transform: rotate(26deg) translate(13px, -18px);
}

.mfd-chip[data-chip-pose='wave'] .mfd-chip-svg__arm--right {
  transform: rotate(-36deg) translate(4px, -31px);
  animation: mfd-chip-wave 900ms steps(4, end) infinite;
}

.mfd-chip[data-chip-pose='think'] .mfd-chip-svg__arm--right {
  transform: rotate(-18deg) translate(-11px, -13px);
}

.mfd-chip[data-chip-pose='think'] .mfd-chip-svg__head {
  transform: rotate(-4deg) translate(-2px, 2px);
}

.mfd-chip[data-chip-pose='whispering'] .mfd-chip-svg__figure {
  transform: translate(2px, -2px) skewX(-2deg);
}

.mfd-chip[data-chip-pose='whispering'] .mfd-chip-svg__tablet {

}

.mfd-chip[data-chip-pose='celebrate'] .mfd-chip-svg__arm--left,

  transform: translateY(-28px);
}

.mfd-chip[data-chip-pose='celebrate'] .mfd-chip-svg__figure {
  animation: mfd-chip-celebrate-bounce 1s steps(6, end) infinite;
}

.mfd-chip[data-chip-pose='excited'] .mfd-chip-svg__arm--left,
.mfd-chip[data-chip-pose='excited'] .mfd-chip-svg__arm--right {
  transform: translateY(-32px);
}

.mfd-chip[data-chip-motion='animated'][data-chip-pose='excited'] .mfd-chip-svg__figure {
  animation: mfd-chip-excited-bounce 400ms steps(4, end) 4;
}

.mfd-chip[data-chip-pose='concern'] .mfd-chip-svg__head {
  transform: rotate(3deg) translateY(4px);
}

.mfd-chip[data-chip-pose='concern'] .mfd-chip-svg__brow--left {
  transform: rotate(14deg) translateY(2px);
}

.mfd-chip[data-chip-pose='concern'] .mfd-chip-svg__brow--right {
  transform: rotate(-14deg) translateY(2px);
}

.mfd-chip[data-chip-pose='warning'] .mfd-chip-svg__brow--left {
  transform: rotate(20deg) translate(1px, 3px);
}

.mfd-chip[data-chip-pose='warning'] .mfd-chip-svg__brow--right {
  transform: rotate(-20deg) translate(-1px, 3px);
}

.mfd-chip[data-chip-motion='animated'][data-chip-pose='warning'] .mfd-chip-svg__warning-watch {
  animation: mfd-chip-warning-watch-tap 1.2s steps(4, end) infinite;
}

.mfd-chip[data-chip-pose='surprised'] .mfd-chip-svg__head {
  transform: rotate(-7deg) translate(-3px, -2px);
}

.mfd-chip[data-chip-pose='surprised'] .mfd-chip-svg__headset {
  transform: rotate(8deg) translate(2px, -2px);
}

.mfd-chip[data-chip-pose='surprised'] .mfd-chip-svg__eye {
  transform: scale(1.24);
}

.mfd-chip[data-chip-motion='animated'][data-chip-pose='surprised'] .mfd-chip-svg__figure {
  animation: mfd-chip-surprised-jolt 1.8s steps(6, end) infinite;
}

.mfd-chip[data-chip-pose='sad'] .mfd-chip-svg__figure {
  transform: translateY(5px) rotate(-2deg);
}

.mfd-chip[data-chip-pose='sad'] .mfd-chip-svg__head {

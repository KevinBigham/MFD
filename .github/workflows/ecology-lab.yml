name: GOAT Ecology Lab

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goat-ecology-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: ${{ matrix.persona }} / seed ${{ matrix.seed }} / ${{ matrix.seasons }}y
    runs-on: ubuntu-latest
    # 50y cells measure ~115-118 min remotely; 180 gives headroom without
    # letting a hung cell burn runner hours. 100y lives in ecology-lab-100y.yml
    # because ~235 min cannot fit a sane nightly timeout.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # 100 cells x ~86 min avg / 10 parallel ~= 14h window, safely under the
      # 24h limit where GitHub auto-cancels long-queued jobs.
      max-parallel: 10
      matrix:
        seed: [11, 29, 42, 73, 101, 211, 307, 401, 509, 601]
        persona: [CHEAPSKATE, CHURN_ARTIST, GLUTTON, INJURY_MAGNET, SPEEDRUNNER]
        seasons: [25, 50]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run hard-threshold ecology certification
        run: pnpm ecology:cell --persona "${{ matrix.persona }}" --seed "${{ matrix.seed }}" --seasons "${{ matrix.seasons }}"
      - name: Upload certification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecology-${{ matrix.persona }}-${{ matrix.seed }}-${{ matrix.seasons }}y
          path: tmp/playtest-report-${{ matrix.persona }}-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 30

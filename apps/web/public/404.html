<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mr. Football Dynasty</title>
    <script>
      // SPA redirect for GitHub Pages
      // Redirects 404 requests to the index page with hash routing
      var path = window.location.pathname;
      var base = '/MFD/';
      if (path !== base && path !== base + 'index.html') {
        var route = path.replace(base, '/');
        window.location.replace(base + '#' + route);
      } else {
        window.location.replace(base);
      }
    </script>
  </head>
  <body></body>
</html>
